# /csharp-api 反代段——追加到托管机 /usr/local/openresty/nginx/site/jeeflow-demo.conf
# 的 443 server 块内（与 /moon-api/ 段并列），然后：
#   /usr/local/openresty/nginx/sbin/nginx -t && /usr/local/openresty/nginx/sbin/nginx -s reload
#
# 端口规划对齐七语言（java 16080 / go 16081 / py 16082 / node 16083 / php 16084 / rust 16085 / moon 16086）：
#   csharp demo 容器 = 16087 -> 容器内 8093（jeeflow-csharp demo-deploy.yml）
#
# 生效验证：
#   curl -s -X POST https://jeeflow-demo.mldong.com/csharp-api/wf/processDefine/page \
#     -H 'Content-Type: application/json' -d '{"pageNum":1,"pageSize":2}'

    location /csharp-api/ {
        proxy_pass http://localhost:16087/;
        proxy_read_timeout      300;
        proxy_connect_timeout   300;
        proxy_set_header    Host                $http_host;
        proxy_set_header    X-Real-IP           $remote_addr;
        proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;
    }
